name: Compilar Dembow Clasico

# Corre al subir cambios a main, al crear una etiqueta vX.Y.Z (publica una Release) o a mano.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (instalador .pkg / .dmg)
    runs-on: macos-14
    timeout-minutes: 75
    env:
      # Firma y notarización con Apple: solo si agregas estos secretos en Settings → Secrets → Actions.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar (Apple Silicon + Intel)
        run: cmake --build build --config Release --parallel 4

      - name: Importar certificados de Apple (opcional)
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/dembow.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certs.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
                   -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certs.p12"

      - name: Armar instalador
        env:
          JUCE_DIR: build/_deps/juce-src
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: bash installer/build_mac_installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Dembow-Clasico-macOS
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

      # ---- Pruebas: instala el .pkg en esta Mac y valida los plugins instalados ----
      - name: Probar el instalador
        run: |
          sudo installer -pkg dist/*.pkg -target / -verbose
          ls -la "/Library/Audio/Plug-Ins/VST3/Dembow Clasico.vst3" \
                 "/Library/Audio/Plug-Ins/Components/Dembow Clasico.component" \
                 "/Applications/Dembow Clasico.app"
          pkgutil --pkgs | grep -i dembowclasico
          codesign --verify --deep --strict "/Library/Audio/Plug-Ins/Components/Dembow Clasico.component"

      - name: Validar Audio Unit (auval)
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Ecoa" || true
          auval -v aumu Dmbw Ecoa

      - name: Validar con pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          PV=./pluginval.app/Contents/MacOS/pluginval
          status=0
          for p in "/Library/Audio/Plug-Ins/VST3/Dembow Clasico.vst3" "/Library/Audio/Plug-Ins/Components/Dembow Clasico.component"; do
            name="$(basename "$p")"
            ok=0
            for attempt in 1 2; do
              if $PV --strictness-level 10 --validate-in-process --timeout-ms 300000 "$p" > "pv-$name.txt" 2>&1; then
                ok=1; break
              fi
              python3 -c 'import sys; t=open(sys.argv[2],errors="replace").read()[-6000:]; print("::warning title="+sys.argv[1]+"::"+t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "pluginval $name intento $attempt" "pv-$name.txt"
            done
            if [ "$ok" = 1 ]; then
              echo "OK: $name"; tail -3 "pv-$name.txt"
            else
              # deja el final del reporte como anotación (se puede leer desde la API de GitHub)
              python3 -c 'import sys; t=open(sys.argv[2],errors="replace").read()[-8000:]; print("::error title="+sys.argv[1]+"::"+t.replace("%","%25").replace("\r","").replace("\n","%0A"))' "pluginval $name" "pv-$name.txt"
              status=1
            fi
          done
          exit $status

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -S . -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Empaquetar
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^project\(DembowClasico VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          python installer/make_resources.py --juce build/_deps/juce-src --out res
          mkdir -p "dist/Dembow Clasico"
          cp -R "build/DembowClasico_artefacts/Release/VST3/Dembow Clasico.vst3" "dist/Dembow Clasico/"
          cp "build/DembowClasico_artefacts/Release/Standalone/Dembow Clasico.exe" "dist/Dembow Clasico/"
          cp res/Licencias.txt "dist/Dembow Clasico/Licencias.txt"
          cp README.md "dist/Dembow Clasico/LEEME.md"
          cd dist && 7z a "Dembow-Clasico-$VERSION-Windows.zip" "Dembow Clasico" > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Dembow-Clasico-Windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
